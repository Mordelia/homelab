global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          machine: "nas"

  # Remote machines (node-exporter deployed on each host, sanitized here).
  # On the NAS, replace example.local with the real LAN IPs (never commit).
  - job_name: node-small-machine
    static_configs:
      - targets: ["example.local:xxxx"]
        labels:
          machine: "small"

  - job_name: node-media-machine
    static_configs:
      - targets: ["example.local:xxxx"]
        labels:
          machine: "media"

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Blackbox HTTP probes (generic internal services, sanitized).
  # Replace example.local targets with real internal URLs on the NAS only (never commit).
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - "http://example.local"
          - "http://example.local"
          - "http://example.local"
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: "blackbox-exporter:9115"

  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s

    relabel_configs:
      - source_labels: [__meta_docker_container_label_prometheus_enable]
        regex: "true"
        action: keep

      - source_labels: [__meta_docker_container_name]
        target_label: container

      - source_labels: [__meta_docker_container_label_prometheus_port]
        target_label: __address__
        replacement: $1
