global:
  # How long to wait before sending a notification again if it hasn't been resolved.
  resolve_timeout: 5m

route:
  receiver: "discord"
  # Group alerts to avoid Discord spam: one message per batch of similar alerts.
  group_by: ["alertname", "instance"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "discord"
    discord_configs:
      # Git version keeps a placeholder on purpose.
      # On the NAS only: replace the line below with the real webhook URL
      # (same value as Diun's DISCORD webhook), then reload Alertmanager.
      # Never commit the real URL.
      - webhook_url: "http://example.local"
        send_resolved: true
        title: "Homelab alert"
